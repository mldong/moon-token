name: publish

# 文件名叫 publish.yml、name 叫 publish，与 jeeflow-moon 的发布入口对齐（那条仓也只有一个
# publish.yml 承担发版，命名统一优先于「这条流水里检查更占篇幅」的观感）。
# 参赛验收第 5 条要的 CI 覆盖检查/构建/测试，由其中的 verify job 兑现，
# job 名保持 Check / Build / Test (wasm + native)，run log 里一眼能看得出来。

# 一条流水做完两件事：verify 跑检查/构建/测试（参赛验收第 5 条：CI 必须覆盖这三件事，
# native 档只在 CI 跑，本机不试），全绿之后 publish 才把四个模块发到 mooncakes。
# 10-02 之前这是两份 workflow（ci.yml + publish.yml）并行跑在同一枚 tag 上，
# 发布只靠自己那道 "用例数 >= 61" 的兜底门防"带红发布"；合成一条之后 verify 是 publish 的
# 硬前置（needs），那道兜底门就撤掉了，`moon check`/`moon test` 也不用在两处各跑一遍。
#
# 触发：
#   push tag v*.*.*   → 检查 + 发布（发版）
#   workflow_dispatch → 默认只检查；勾 publish=true 才发（重发同一代次安全，见下面的重入口径）
#
# 文档代码块分两种目标代次（DOCS_TARGET），这是合并时撞出来的结构性冲突，值得留在这里：
# docs-check 的 registry 模式编译对象永远是注册表最新代次。给 trait 加方法这类破坏性变更，
# 文档已按新 API 写好、注册表还是旧代次 ⇒ 发版 tag 上 verify 必然红，而 verify 又是 publish 的前置
# ⇒ 死锁，永远发不出去。所以 verify 里这两步切 source（临时 workspace 指向本仓 store/ 与 core/，
# 判"文档与当前这棵树对不对得上"），registry 那一支挪到发布之后跑，正好当"用户那条腿"的传播验证
# （上传 200 / 版本可见 / 安装能解析是三件事，前两件的滞后不会骗过它）。
#
# 发布通道沿革：0.1.0–0.1.6 由本机 scripts/publish-module.sh 发（该脚本已删）。迁移动因是 10-02 那次
# 实发：本机上传连断 4 回 TLS close_notify，同一条链在 Actions 上 37s 跑完，发版不该看本机网络脸色。
#
# 凭证：org mldong 的 MOON_TOKEN / MOON_USERNAME（jeeflow-moon 发布链用的就是这两个，对本仓可见，
# 自检 run 37009104579 的 Preflight 报"长度 32"）。仓库级同名 secret 会覆盖 org 级。
# Preflight 只判到位与否并打印长度，绝不打印值。
#
# 重入与索引滞后（两条都是别处踩过的坑，机制照搬 jeeflow-moon 的已验证形态）：
#   - store 刚发完几秒，core 的包体校验要从 registry 解析 mldong/moon-token-store@<新版本>，
#     索引没刷新就会 "no version satisfies" 卡死整条链；此时 store 已在注册表，重跑又撞重复发布。
#     ⇒ .github/scripts/publish-if-absent.sh 每步前 moon update，已在注册表即跳过。
#   - CLI 退出码不区分"真没发上去"和"上传之后环节报错" ⇒ 发后一律回查索引复核。
#
# 失败重试口径：**修复落在 master 而 tag 还指旧 commit 时**，Re-run 只会 checkout tag 那棵旧树、
# 拿不到修复 ⇒ 那种情况改用 workflow_dispatch（勾 publish，跑 master HEAD）或把 tag 重指到
# 修复后的 commit 再推；纯网络抖动才直接 Re-run 原 run；部分模块已发成功就按拓扑步进补发，
# 别 bump 版本号绕。

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: "检查全绿后是否发布到 mooncakes（tag 触发默认发布；手动触发需显式勾选）"
        type: boolean
        default: false

# 同一时刻只许一条在跑：发版链不能被后来的 run 掐断，也不许两条并发互踩索引
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check / Build / Test (wasm + native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version + workspace deps
        run: |
          moon version --all
          moon update

      - name: Check
        run: moon check --target wasm --no-render

      - name: Build
        run: |
          moon build --target wasm --no-render
          moon build --target native --no-render

      - name: Test
        run: |
          moon test --target wasm --no-render | tee wasm-test.txt
          moon test --target native --no-render | tee native-test.txt
          # 门禁：用例条数必须与测试矩阵一致（wasm-gc 档会静默丢弃 async 用例仍 exit 0，
          # 所以"退出码 0"不构成"跑过了"的证据）
          grep -q "Total tests: 83" wasm-test.txt
          grep -q "Total tests: 83" native-test.txt

      # 参赛验收第 4 条"README 可复现" + 使用文档每个 moonbit 块都真编译真跑。
      # 这两步在 verify 里判的是"文档对不对得上当前这棵树"（DOCS_TARGET=source），
      # 与发布之后 publish job 里那两步（默认 registry，判用户装到的那一代）是两件事，不重复。
      - name: README snippet check (against workspace sources)
        env:
          DOCS_TARGET: source
        run: |
          export MOON_HOME="$HOME/.moon"
          bash scripts/readme-check.sh

      - name: Docs snippet check (against workspace sources)
        env:
          DOCS_TARGET: source
        run: |
          export MOON_HOME="$HOME/.moon"
          bash scripts/docs-check.sh

      - name: Assert zero warnings
        run: |
          moon check --target wasm --no-render 2>&1 | tee check.txt
          ! grep -q "Warning" check.txt

  publish:
    name: Publish store + core + store-file + moonback to mooncakes
    needs: verify
    # tag 直接发；手动触发要显式勾 publish（push 事件里 inputs 是空的，不会误发）。
    # 坑留痕：第一版这里写成 github.ref_type == 'tags'，v0.1.7 那次 tag 推送整个 publish job 被
    # skip（GitHub 的值是单数 'tag'），而 workflow 结论仍是 success——skip 不是失败，看不出来。
    # 所以下面第一步把判定用的三个值打进 log，判错至少留得下现场。
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: What triggered this publish
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          echo "event_name=$GITHUB_EVENT_NAME ref=$GITHUB_REF ref_type=$GITHUB_REF_TYPE"
          core_version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' core/moon.mod | head -1)
          echo "publish input=$PUBLISH_INPUT core version=$core_version"

      - name: Install MoonBit toolchain (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          "$HOME/.moon/bin/moon" version    # 留痕：本次实际编译器版本进 run log

      - name: Preflight credentials present (values never printed)
        env:
          MOON_TOKEN: ${{ secrets.MOON_TOKEN }}
          MOON_USERNAME: ${{ secrets.MOON_USERNAME }}
        run: |
          [ -n "$MOON_TOKEN" ] || {
            echo "::error::secrets.MOON_TOKEN 没到位（org mldong 的 secret 若按仓库授权，需把 mldong/moon-token 加进范围，或在本仓单独建同名 secret）"
            exit 1
          }
          [ -n "$MOON_USERNAME" ] || { echo "::error::secrets.MOON_USERNAME 没到位"; exit 1; }
          echo "凭证到位：token 长度 ${#MOON_TOKEN}（值不外泄），用户名 $MOON_USERNAME"

      - name: Write mooncakes credentials
        run: |
          mkdir -p ~/.moon
          cat > ~/.moon/credentials.json <<EOF
          {"token":"${{ secrets.MOON_TOKEN }}","username":"${{ secrets.MOON_USERNAME }}"}
          EOF

      - name: Update registry index + install workspace dependencies
        run: |
          moon update
          moon install

      - name: Version being published
        run: |
          echo "store = $(sed -nE 's/^version = "([^"]+)".*/\1/p' store/moon.mod | head -1)"
          echo "core  = $(sed -nE 's/^version = "([^"]+)".*/\1/p' core/moon.mod | head -1)"
          echo "store-file = $(sed -nE 's/^version = "([^"]+)".*/\1/p' store-file/moon.mod | head -1)"
          echo "moonback = $(sed -nE 's/^version = "([^"]+)".*/\1/p' moonback/moon.mod | head -1)"

      # 拓扑序：store 先，core 与 store-file 后，moonback 最后（它 pin 着 core 与 store 的同版本号，接力式）。
      # examples 不发布。
      - name: Publish store
        run: bash .github/scripts/publish-if-absent.sh store mldong/moon-token-store

      - name: Publish core
        run: bash .github/scripts/publish-if-absent.sh core mldong/moon-token

      - name: Publish store-file
        run: bash .github/scripts/publish-if-absent.sh store-file mldong/moon-token-store-file

      - name: Publish moonback
        run: bash .github/scripts/publish-if-absent.sh moonback mldong/moon-token-moonback

      # 用户那条腿：这两支脚本用不带版本的 moon add，解析到的就是刚发上去的那一代。
      # 红即"传播没到位或包体坏了"，不是"代码坏了"（代码在 verify 已经判过）。
      - name: Verify consumer leg against just-published modules
        run: |
          export MOON_HOME="$HOME/.moon"
          moon update
          bash scripts/readme-check.sh
          bash scripts/docs-check.sh
