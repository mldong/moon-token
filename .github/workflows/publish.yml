name: publish

# mooncakes.io 发版：push tag v*.*.* 或 workflow_dispatch 触发（手动：
# `gh workflow run publish.yml -f validate_only=true`）。
# 拓扑序两模块 store → core（examples 不发布）。家族同版本号，不许一个 0.1.x 一个 0.1.y。
#
# 通道沿革：0.1.0–0.1.6 由本机 `scripts/publish-module.sh` 发（该脚本已随本通道上线废弃）。
# 换到 CI 的直接动因是 10-02 那次实发：本机上传连续 4 次断在
# `peer closed connection without sending TLS close_notify`（curl 探针判为瞬时网络窗口，
# 第 5 次才通），而 Actions 侧同一条链 37s 稳定跑完——发版不该看本机网络的脸色。
#
# 凭证：用 org `mldong` 的 Actions secrets（`MOON_TOKEN` / `MOON_USERNAME`，
# jeeflow-moon 发布链用的就是这两个）。仓库级若存在同名 secret 会覆盖 org 级。
# 下面 Preflight 只判"有没有到位"，绝不打印值。
#
# 重入与索引滞后（两条都是别处踩过的坑，机制照搬 jeeflow-moon 的已验证形态）：
# - store 刚发完几秒，core 的包体校验要从 registry 解析 `mldong/moon-token-store@<新版本>`，
#   索引没刷新就会 "no version satisfies" 卡死整条链；此时 store 已在注册表，重跑又撞重复发布。
#   ⇒ `.github/scripts/publish-if-absent.sh` 每步前 `moon update`，已在注册表即跳过。
# - CLI 退出码不区分"真没发上去"和"上传之后环节报错" ⇒ 发后一律回查索引复核。
#
# 失败重试口径：**修复落在 master 而 tag 还指旧 commit 时**，Re-run 只会 checkout tag 那个旧树、
# 拿不到修复 ⇒ 那种情况用 `workflow_dispatch`（不带 validate_only，跑 master HEAD）或把 tag
# 重指到修复后的 commit 再推；纯网络抖动才直接 Re-run 原 run；部分模块已发成功就按拓扑步进补发，
# 别 bump 版本号绕。

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      validate_only:
        description: "仅自检通道（装工具链 + 解析依赖 + 构建 + 核凭证），不执行 publish"
        type: boolean
        default: false

# 两条发版链并发会互踩索引：同一时刻只许一条在跑
concurrency:
  group: mooncakes-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          "$HOME/.moon/bin/moon" version    # 留痕：本次实际编译器版本进 run log

      - name: Preflight credentials present (values never printed)
        env:
          MOON_TOKEN: ${{ secrets.MOON_TOKEN }}
          MOON_USERNAME: ${{ secrets.MOON_USERNAME }}
        run: |
          [ -n "$MOON_TOKEN" ] || {
            echo "::error::secrets.MOON_TOKEN 没到位（org mldong 的 secret 若按仓库授权，需把 mldong/moon-token 加进范围，或在本仓单独建同名 secret）"
            exit 1
          }
          [ -n "$MOON_USERNAME" ] || { echo "::error::secrets.MOON_USERNAME 没到位"; exit 1; }
          echo "凭证到位：token 长度 ${#MOON_TOKEN}（值不外泄），用户名 $MOON_USERNAME"

      - name: Write mooncakes credentials
        run: |
          mkdir -p ~/.moon
          cat > ~/.moon/credentials.json <<EOF
          {"token":"${{ secrets.MOON_TOKEN }}","username":"${{ secrets.MOON_USERNAME }}"}
          EOF

      - name: Update registry index + install workspace dependencies
        run: |
          moon update
          moon install

      - name: Validate channel only (build gate, no publish)
        if: ${{ inputs.validate_only }}
        run: moon build --target native --no-render

      # 发版前的最低门槛：零警告 + 用例全过 + 真收到用例（条数只断"不许比上次少"，
      # 不钉死同一个数字——钉死会让这里和 scripts/gate.sh 两处必须同步改，迟早有一处漂）。
      # 文档代码块（docs-check）刻意**不放在这里**：本轮那种"给 trait 加方法"的破坏性变更，
      # 发布前它对注册表旧代次必然照旧绿、发布后才切红，判据用错了档。
      - name: Pre-publish gate (wasm check + test)
        if: ${{ !inputs.validate_only }}
        run: |
          set -euo pipefail
          check_log=$(moon check --target wasm --no-render 2>&1)
          printf '%s\n' "$check_log" | tail -2
          if printf '%s' "$check_log" | grep -q "Warning"; then
            echo "发版拦下：moon check 有警告（零警告发版口径）" >&2
            exit 1
          fi
          test_log=$(moon test --target wasm --no-render 2>&1)
          printf '%s\n' "$test_log" | tail -2
          printf '%s' "$test_log" | grep -q "failed: 0" || { echo "发版拦下：有失败用例" >&2; exit 1; }
          n=$(printf '%s' "$test_log" | sed -n 's/.*Total tests: \([0-9]*\).*/\1/p')
          [ "${n:-0}" -ge 61 ] || { echo "发版拦下：收到用例 ${n:-0} 条，低于基线 61（空跑或漏收就是死格）" >&2; exit 1; }
          echo "预发门禁绿：$n 条用例，0 failed，零警告"

      - name: Publish store
        if: ${{ !inputs.validate_only }}
        run: bash .github/scripts/publish-if-absent.sh store mldong/moon-token-store

      - name: Publish core
        if: ${{ !inputs.validate_only }}
        run: bash .github/scripts/publish-if-absent.sh core mldong/moon-token

      # 发完必须验"用户那条腿"：上传 200 / 版本可见 / 安装能解析是三件事，
      # 索引与 CDN 的传播延迟会做出"发上去了但别人装不到"。这两个脚本都是 `moon add`
      # 不带版本 ⇒ 解析到的就是刚发上去的那一代，红即"传播没到位或包体坏了"，不是"代码坏了"。
      - name: Verify consumer leg against just-published modules
        if: ${{ !inputs.validate_only }}
        run: |
          moon update
          bash scripts/readme-check.sh
          bash scripts/docs-check.sh
